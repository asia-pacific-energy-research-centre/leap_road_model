<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Road assumptions dashboard</title>
  <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --page: light-dark(#f3f7f6, #0f181a);
      --surface: light-dark(#ffffff, #172326);
      --surface-2: light-dark(#eaf2f0, #1d2d30);
      --ink: light-dark(#163238, #e6f1ef);
      --muted: light-dark(#65787b, #c3d0ce);
      --line: light-dark(#d4e0dd, #304144);
      --plot-grid: light-dark(rgb(22 50 56 / .11), rgb(211 226 223 / .13));
      --plot-axis: light-dark(#65787b, #ced9d7);
      --plot-frame: light-dark(rgb(22 50 56 / .20), rgb(211 226 223 / .23));
      --series-1: light-dark(#087f70, #55d8c3);
      --series-2: light-dark(#c9552d, #ff936d);
      --series-3: light-dark(#356fa8, #7eb8f0);
      --series-4: light-dark(#a87900, #f0c94f);
      --series-5: light-dark(#7352a2, #c29ae9);
      --series-6: light-dark(#b74764, #f28aa4);
      --series-7: light-dark(#4f8139, #8bd071);
      --series-8: light-dark(#8f5b3a, #dea47e);
      --series-9: light-dark(#247f89, #66cbd6);
      --series-10: light-dark(#9d468e, #e18bd0);
      --series-11: light-dark(#5f6872, #bac5d0);
      --series-12: light-dark(#bd7420, #f4aa52);
      --header-a: #123c42;
      --header-b: #087f70;
      --accent: light-dark(#087f70, #44c9b5);
      --warning: light-dark(#fff4d6, #2b291f);
      --warning-ink: light-dark(#695115, #eadca7);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--page); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, select { font: inherit; }
    header { position: relative; padding: 20px clamp(16px, 3vw, 34px) 18px; padding-right: min(280px, 31vw); color: #fff; background: linear-gradient(120deg, var(--header-a), var(--header-b)); }
    .kicker { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .72; }
    h1 { margin: 4px 0 5px; font-size: clamp(25px, 3.2vw, 36px); font-weight: 520; letter-spacing: -.025em; }
    header p { margin: 0; font-size: 13px; opacity: .82; }
    .dashboard-switcher { position: absolute; right: clamp(16px, 3vw, 34px); top: 20px; width: min(220px, 28vw); }
    .dashboard-switcher label, .field label { display: block; margin-bottom: 5px; font-size: 11px; color: var(--muted); }
    .dashboard-switcher label { color: #fff; opacity: .8; }
    select { width: 100%; min-height: 38px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); background: var(--surface); }
    .dashboard-switcher select { color: #fff; border-color: rgb(255 255 255 / .35); background: rgb(9 49 51 / .58); }
    .dashboard-switcher option { color: var(--ink); background: var(--surface); }
    .page-tabs { display: flex; gap: 4px; padding: 0 clamp(16px, 3vw, 34px); border-bottom: 1px solid var(--line); background: var(--surface); overflow-x: auto; white-space: nowrap; }
    .page-tabs button, .metric-tabs button { padding: 11px 10px 9px; border: 0; color: var(--muted); background: transparent; cursor: pointer; }
    .page-tabs button[aria-pressed="true"], .metric-tabs button[aria-pressed="true"] { color: var(--ink); border-bottom: 2px solid var(--accent); }
    .toolbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 11px 14px; padding: 13px clamp(16px, 3vw, 34px); border-bottom: 1px solid var(--line); background: var(--surface); align-items: end; }
    .field label { color: var(--muted); }
    .metric-tabs { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; padding-top: 9px; border-top: 1px solid var(--line); }
    main { padding: 18px clamp(16px, 3vw, 34px) 32px; }
    .notice { margin-bottom: 14px; padding: 9px 11px; border-left: 3px solid currentColor; color: var(--warning-ink); background: var(--warning); font-size: 11px; line-height: 1.5; }
    .chart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 10px; min-width: 0; }
    .chart-head > div:first-child { min-width: 0; }
    .chart-head h2 { margin: 0 0 4px; font-size: 19px; font-weight: 540; }
    .chart-head p { max-width: 820px; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; flex: 0 1 auto; }
    .actions button { min-height: 34px; padding: 6px 9px; border: 1px solid var(--line); color: var(--ink); background: var(--surface); cursor: pointer; white-space: nowrap; }
    #chart { width: 100%; height: min(60vh, 560px); min-height: 390px; border: 1px solid var(--plot-frame); background: var(--surface); }
    .note { margin-top: 11px; padding: 9px 11px; border-left: 3px solid var(--accent); color: var(--muted); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); font-size: 11px; line-height: 1.5; }
    .note strong { color: var(--ink); font-weight: 550; }
    .footer-line { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 18px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .assumptions { max-width: 1050px; }
    .assumptions h2 { margin: 0 0 6px; font-size: 21px; font-weight: 550; }
    .assumptions > p { margin: 0 0 23px; max-width: 850px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .assumption-group { margin-top: 23px; }
    .assumption-group h3 { margin: 0 0 4px; font-size: 16px; font-weight: 550; }
    .assumption { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .assumption h4 { margin: 0 0 4px; font-size: 13px; font-weight: 550; }
    .assumption p { margin: 4px 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .assumption .effect strong { color: var(--ink); font-weight: 550; }
    [hidden] { display: none !important; }
    @media (max-width: 1120px) {
      .chart-head { flex-direction: column; }
      .actions { justify-content: flex-start; }
    }
    @media (max-width: 900px) {
      .toolbar { grid-template-columns: repeat(3, minmax(120px, 1fr)); }
    }
    @media (max-width: 620px) {
      header { padding-right: 16px; padding-top: 78px; }
      .dashboard-switcher { top: 14px; left: 16px; right: 16px; width: auto; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .metric-tabs { overflow-x: auto; flex-wrap: nowrap; }
      #chart { height: 440px; min-height: 440px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="kicker">9th edition · road assumptions</div>
    <h1 id="pageTitle">Road review dashboard</h1>
    <div class="dashboard-switcher">
      <label for="dashboardSelect">Dashboard</label>
      <select id="dashboardSelect">
        <option value="../non_road_assumptions_dashboard/non_road_assumptions_dashboard_all_economies.html">Domestic non-road</option>
        <option value="../international_transport_assumptions_dashboard/international_transport_assumptions_dashboard_all_economies.html">International</option>
        <option value="" selected>Road transport</option>
      </select>
    </div>
  </header>

  <nav class="page-tabs" aria-label="Dashboard pages">
    <button data-page="outcomes" aria-pressed="true">Model outcomes</button>
    <button data-page="fleet" aria-pressed="false">Fleet transition</button>
    <button data-page="assumptions" aria-pressed="false">Assumptions explained</button>
  </nav>

  <section id="toolbar" class="toolbar">
    <div class="field">
      <label for="economy">Economy</label>
      <select id="economy"></select>
    </div>
    <div class="field">
      <label for="scenario">Scenario</label>
      <select id="scenario"><option>Reference</option><option>Target</option></select>
    </div>
    <div class="field">
      <label for="transport">Transport type</label>
      <select id="transport"><option value="passenger">Passenger</option><option value="freight">Freight</option></select>
    </div>
    <div id="vehicleField" class="field fleet-only" hidden>
      <label for="vehicle">Vehicle type</label>
      <select id="vehicle"><option value="all">All vehicle types</option></select>
    </div>
    <div id="groupByField" class="field fleet-only" hidden>
      <label for="groupBy">Group lines by</label>
      <select id="groupBy"><option value="drive">Drive</option><option value="fuel">Fuel</option><option value="vehicle_type">Vehicle type</option></select>
    </div>
    <div id="outcomeMetrics" class="metric-tabs">
      <button data-measure="energy" aria-pressed="true">Energy by fuel</button>
      <button data-measure="stock" aria-pressed="false">Stock by fuel</button>
      <button data-measure="mileage" aria-pressed="false">Mileage by fuel</button>
      <button data-measure="efficiency" aria-pressed="false">Efficiency by fuel</button>
    </div>
    <div id="fleetMetrics" class="metric-tabs" hidden>
      <button data-measure="vehicle_stock" aria-pressed="true">Physical stock</button>
      <button data-measure="fuel_allocated_stock" aria-pressed="false">Fuel-allocated stock</button>
      <button data-measure="fuel_allocated_sales" aria-pressed="false">Fuel-allocated sales</button>
      <button data-measure="turnover_rate" aria-pressed="false">Turnover rate</button>
      <button data-measure="retirement_rate" aria-pressed="false">Retirement rate</button>
    </div>
  </section>

  <main>
    <section id="chartPage">
      <div id="coverageNotice" class="notice"></div>
      <div class="chart-head">
        <div>
          <h2 id="chartTitle"></h2>
          <p id="chartDescription"></p>
        </div>
        <div class="actions">
          <button id="downloadChart">Download this chart (CSV)</button>
          <button id="downloadAll">Download all road data (CSV)</button>
        </div>
      </div>
      <div id="chart"></div>
      <div id="interpretationNote" class="note"></div>
      <div class="footer-line">
        <span id="seriesCount"></span>
        <span>Click legend items to hide or show individual lines.</span>
      </div>
    </section>

    <section id="assumptionsPage" class="assumptions" hidden>
      <h2>What sits behind the road results</h2>
      <p id="assumptionsLead"></p>
      <div id="assumptionGroups"></div>
    </section>
  </main>

  <script>
    const PAYLOAD = __ROAD_DASHBOARD_DATA__;
    const DATA = PAYLOAD.data_rows.map(row => Object.fromEntries(PAYLOAD.data_columns.map((column, index) => [column, row[index]])));
    let page = "outcomes";
    let outcomeMeasure = "energy";
    let fleetMeasure = "vehicle_stock";
    let visibleRows = [];

    const $ = id => document.getElementById(id);
    const paletteProperties = Array.from({length: 12}, (_, index) => `--series-${index + 1}`);

    function cssColor(propertyName) {
      const probe = document.createElement("span");
      probe.style.color = `var(${propertyName})`;
      probe.style.position = "absolute";
      probe.style.visibility = "hidden";
      document.body.appendChild(probe);
      const color = getComputedStyle(probe).color;
      probe.remove();
      return color;
    }
    const measureInfo = {
      energy: ["Road energy by output fuel", "Final reconciled road energy. Every reported output fuel is available; Total is the sum across fuels.", "PJ"],
      stock: ["Road stock by allocated fuel", "Fuel-allocated stock from the final outcome series. Multi-fuel technologies can contribute to more than one fuel.", "million fuel-allocated vehicles"],
      mileage: ["Annual mileage input by fuel", "The full model input path for average distance travelled per vehicle in each fuel allocation.", "km per vehicle per year"],
      efficiency: ["Vehicle efficiency input by fuel", "The full model input path for energy used per 100 km. Lower values indicate less energy per unit of travel.", "thousand MJ/100km"],
      vehicle_stock: ["Physical vehicle stock by vehicle type", "Unique vehicle totals by vehicle type. This is the correct fleet-total view.", "million vehicles"],
      fuel_allocated_stock: ["Detailed fuel-allocated stock", "Diagnostic allocation by vehicle type, drive and fuel. It is useful for reviewing transitions, but multi-fuel lines must not be added as unique vehicles.", "million fuel-allocated vehicles"],
      fuel_allocated_sales: ["Detailed fuel-allocated sales", "New vehicle sales represented in the drive/fuel diagnostic output.", "million fuel-allocated vehicles"],
      turnover_rate: ["Turnover rate used in the fleet calculation", "The share of an existing cohort removed in a year. Values are shown as percentages.", "% of stock per year"],
      retirement_rate: ["Retirement rate applied", "The retirement share applied in the stock projection diagnostic. Values are shown as percentages.", "% of stock per year"]
    };

    function label(value) {
      const labels = {"2w":"Two-wheelers", "bus":"Bus", "car":"Car", "suv":"SUV", "lt":"Light truck", "lcv":"Light commercial vehicle", "mt":"Medium truck", "ht":"Heavy truck", "bev":"BEV", "cng":"CNG", "fcev":"FCEV", "ice_d":"Diesel ICE", "ice_g":"Gasoline ICE", "phev_d":"Diesel PHEV", "phev_g":"Gasoline PHEV", "hev_d":"Diesel HEV", "hev_g":"Gasoline HEV", "erev_d":"Diesel EREV", "erev_g":"Gasoline EREV", "lng":"LNG", "lpg":"LPG"};
      return labels[value] || value.replaceAll("_", " ").replace(/\b\w/g, x => x.toUpperCase());
    }

    function aggregate(rows, seriesField, percentMeasure) {
      const grouped = new Map();
      rows.forEach(row => {
        const series = row[seriesField];
        const key = `${series}|${row.year}`;
        if (!grouped.has(key)) grouped.set(key, {series, year: row.year, sum: 0, count: 0});
        const item = grouped.get(key);
        item.sum += Number(row.value);
        item.count += 1;
      });
      return [...grouped.values()].map(item => ({series: item.series, year: item.year, value: percentMeasure ? item.sum / item.count * 100 : item.sum}));
    }

    function updateVehicleOptions() {
      const transport = $("transport").value;
      const options = [...new Set(DATA.filter(d => d.dataset === "fleet" && d.transport_type === transport).map(d => d.vehicle_type))].sort();
      const current = $("vehicle").value;
      $("vehicle").innerHTML = '<option value="all">All vehicle types</option>' + options.map(x => `<option value="${x}">${label(x)}</option>`).join("");
      if (options.includes(current)) $("vehicle").value = current;
    }

    function renderChart() {
      const scenario = $("scenario").value;
      const transport = $("transport").value;
      const measure = page === "outcomes" ? outcomeMeasure : fleetMeasure;
      const percentMeasure = ["turnover_rate", "retirement_rate"].includes(measure);
      let rows = DATA.filter(d => d.scenario === scenario && d.transport_type === transport && d.measure === measure);
      let seriesField = "fuel";

      if (page === "fleet") {
        const vehicle = $("vehicle").value;
        if (vehicle !== "all") rows = rows.filter(d => d.vehicle_type === vehicle);
        seriesField = measure === "vehicle_stock" ? "vehicle_type" : $("groupBy").value;
      }

      const plotted = aggregate(rows, seriesField, percentMeasure);
      const series = [...new Set(plotted.map(d => d.series))].sort((a, b) => a === "Total" ? -1 : b === "Total" ? 1 : String(a).localeCompare(String(b)));
      const palette = paletteProperties.map(cssColor);
      const traces = series.map((name, index) => {
        const points = plotted.filter(d => d.series === name).sort((a, b) => a.year - b.year);
        return {
          x: points.map(d => d.year), y: points.map(d => d.value), name: label(name),
          type: "scatter", mode: "lines", line: {width: name === "Total" ? 3.4 : 2.4, color: palette[index % palette.length], dash: index >= palette.length ? "dash" : "solid"},
          hovertemplate: `<b>${label(name)}</b><br>%{x}: %{y:,.3g}<extra></extra>`
        };
      });
      const [title, description, unit] = measureInfo[measure];
      $("chartTitle").textContent = title;
      $("chartDescription").textContent = `${scenario} · ${label(transport)} road. ${description}`;
      $("coverageNotice").textContent = page === "outcomes"
        ? `Coverage: ${PAYLOAD.meta.outcome_horizon}. Energy and stock use full reconciled results when available; if only a reconciliation checkpoint exists, the complete model input path is shown. Mileage and efficiency use their full input paths.`
        : PAYLOAD.meta.has_fleet_data
          ? `Detailed fleet coverage: ${PAYLOAD.meta.fleet_horizon}. This horizon comes from the available fleet diagnostics.`
          : `Detailed fleet diagnostics are not available for ${PAYLOAD.meta.economy_name}; use Model outcomes to review the available road series.`;
      $("interpretationNote").innerHTML = page === "fleet" && !PAYLOAD.meta.has_fleet_data
        ? "<strong>Why this page is empty:</strong> The source folder contains the economy’s road outcome charts but not its detailed stock-projection diagnostic files."
        : page === "outcomes"
        ? "<strong>Reading the fuel lines:</strong> Fuel is the energy output after alternatives are allocated. Energy and stock are reconciled outcomes; mileage and efficiency are model inputs. Fuel-allocated stock is not a count of mutually exclusive technologies."
        : measure === "vehicle_stock"
          ? "<strong>Physical stock:</strong> These lines represent unique vehicles by vehicle type and can be added to obtain the physical fleet total."
          : "<strong>Detailed drive/fuel diagnostic:</strong> Drive is the vehicle technology; fuel is an output allocation. Multi-fuel vehicles can appear on several fuel rows, so summed fuel-allocated stock or sales is not a unique vehicle count.";
      $("seriesCount").textContent = series.length
        ? `${series.length} individual ${seriesField === "vehicle_type" ? "vehicle-type" : seriesField} series shown.`
        : "No series available for this selection.";

      const inkColor = cssColor("--ink");
      const axisColor = cssColor("--plot-axis");
      const gridColor = cssColor("--plot-grid");
      const surfaceColor = cssColor("--surface");
      Plotly.react("chart", traces, {
        paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
        font: {family: "Inter, system-ui, sans-serif", color: inkColor},
        margin: {l: 86, r: 24, t: series.length > 8 ? 92 : series.length > 5 ? 64 : 44, b: 62}, hovermode: "x unified",
        xaxis: {title: {text: "Year", font: {color: inkColor}}, tickfont: {color: axisColor}, gridcolor: gridColor, linecolor: axisColor, zerolinecolor: gridColor, automargin: true},
        yaxis: {title: {text: unit, font: {color: inkColor}}, tickfont: {color: axisColor}, gridcolor: gridColor, linecolor: axisColor, zerolinecolor: gridColor, rangemode: percentMeasure ? "tozero" : "normal", automargin: true},
        legend: {orientation: "h", y: 1.03, yanchor: "bottom", font: {size: 11, color: axisColor}},
        hoverlabel: {bgcolor: surfaceColor, bordercolor: axisColor, font: {color: inkColor}},
        annotations: traces.length ? [] : [{text: `No detailed fleet data available for ${PAYLOAD.meta.economy_name}`, showarrow: false, font: {color: axisColor, size: 14}, x: .5, y: .5, xref: "paper", yref: "paper"}]
      }, {responsive: true, displaylogo: false});
      visibleRows = plotted.map(d => ({scenario, transport_type: transport, measure, series_dimension: seriesField, series: d.series, year: d.year, value: d.value, unit}));
    }

    function renderAssumptions() {
      const scopes = [...new Set(PAYLOAD.assumptions.map(a => a.scope))];
      $("assumptionGroups").innerHTML = scopes.map(scope => `
        <section class="assumption-group"><h3>${scope}</h3>
          ${PAYLOAD.assumptions.filter(a => a.scope === scope).map(a => `<article class="assumption"><h4>${a.title}</h4><p>${a.explanation}</p><p class="effect"><strong>What this changes:</strong> ${a.effect}</p></article>`).join("")}
        </section>`).join("");
    }

    function setPage(nextPage) {
      page = nextPage;
      document.querySelectorAll(".page-tabs button").forEach(button => button.setAttribute("aria-pressed", button.dataset.page === page));
      const isAssumptions = page === "assumptions";
      $("toolbar").hidden = isAssumptions;
      $("chartPage").hidden = isAssumptions;
      $("assumptionsPage").hidden = !isAssumptions;
      if (isAssumptions) return;
      const isFleet = page === "fleet";
      document.querySelectorAll(".fleet-only").forEach(element => element.hidden = !isFleet);
      $("outcomeMetrics").hidden = isFleet;
      $("fleetMetrics").hidden = !isFleet;
      $("groupByField").hidden = !isFleet || fleetMeasure === "vehicle_stock";
      updateVehicleOptions();
      renderChart();
    }

    function csvEscape(value) {
      const text = value == null ? "" : String(value);
      return /[",\n]/.test(text) ? `"${text.replaceAll('"', '""')}"` : text;
    }
    function downloadCsv(rows, filename) {
      if (!rows.length) return;
      const columns = Object.keys(rows[0]);
      const csv = [columns.join(","), ...rows.map(row => columns.map(column => csvEscape(row[column])).join(","))].join("\r\n");
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([csv], {type: "text/csv;charset=utf-8"}));
      link.download = filename; link.click(); URL.revokeObjectURL(link.href);
    }

    document.querySelectorAll(".page-tabs button").forEach(button => button.addEventListener("click", () => setPage(button.dataset.page)));
    document.querySelectorAll("#outcomeMetrics button").forEach(button => button.addEventListener("click", () => {
      outcomeMeasure = button.dataset.measure;
      document.querySelectorAll("#outcomeMetrics button").forEach(item => item.setAttribute("aria-pressed", item === button));
      renderChart();
    }));
    document.querySelectorAll("#fleetMetrics button").forEach(button => button.addEventListener("click", () => {
      fleetMeasure = button.dataset.measure;
      document.querySelectorAll("#fleetMetrics button").forEach(item => item.setAttribute("aria-pressed", item === button));
      $("groupByField").hidden = fleetMeasure === "vehicle_stock";
      renderChart();
    }));
    ["scenario", "transport", "vehicle", "groupBy"].forEach(id => $(id).addEventListener("change", () => { if (id === "transport") updateVehicleOptions(); renderChart(); }));
    Object.entries(PAYLOAD.meta.economies).forEach(([code, name]) => {
      const option = document.createElement("option");
      option.value = PAYLOAD.meta.dashboard_files[code];
      option.textContent = `${name} (${code})`;
      option.selected = code === PAYLOAD.meta.economy;
      $("economy").appendChild(option);
    });
    $("economy").addEventListener("change", event => { if (event.target.value) window.location.href = event.target.value; });
    $("dashboardSelect").addEventListener("change", event => { if (event.target.value) window.location.href = event.target.value; });
    $("downloadChart").addEventListener("click", () => downloadCsv(visibleRows, `${PAYLOAD.meta.economy}_road_${page}_${page === "outcomes" ? outcomeMeasure : fleetMeasure}.csv`));
    $("downloadAll").addEventListener("click", () => downloadCsv(DATA.map(row => ({...row, unit: measureInfo[row.measure]?.[2] || ""})), `${PAYLOAD.meta.economy}_road_dashboard_all_data.csv`));
    document.title = `${PAYLOAD.meta.economy_name} road assumptions dashboard`;
    $("pageTitle").textContent = `${PAYLOAD.meta.economy_name} road review dashboard`;
    $("downloadAll").textContent = `Download all ${PAYLOAD.meta.economy_name} road data (CSV)`;
    $("assumptionsLead").textContent = `This page translates code and configuration settings into review language. It separates assumptions that describe the road model generally from settings that are specifically important for ${PAYLOAD.meta.economy_name}.`;
    renderAssumptions();
    updateVehicleOptions();
    setPage("outcomes");
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (page !== "assumptions") renderChart(); });
  </script>
</body>
</html>
